name: devbim

services:
  studio:
    image: repo.devscience.by/acoustic/devbim-design
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      INVOKEAI_ROOT: /data
      INVOKEAI_HOST: 0.0.0.0
      INVOKEAI_PORT: "9090"
      INVOKEAI_DEVICE: cpu
      INVOKEAI_PRECISION: float32
      STUDIO_AUTH_MODE: ${STUDIO_AUTH_MODE:-users}
      SITE_PASSWORD: ${SITE_PASSWORD:?Set SITE_PASSWORD in deploy/.env}
      STUDIO_SESSION_SECRET: ${STUDIO_SESSION_SECRET:?Set STUDIO_SESSION_SECRET in deploy/.env}
      STUDIO_SESSION_TTL: ${STUDIO_SESSION_TTL:-43200}
      HF_HOME: /data/cache/huggingface
      MPLCONFIGDIR: /data/cache/matplotlib
      XDG_CACHE_HOME: /data/cache
    ports:
      - "${STUDIO_BIND_IP:-127.0.0.1}:${STUDIO_PORT:-9090}:9090"
    volumes:
      - studio-data:/data
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  studio-data:
